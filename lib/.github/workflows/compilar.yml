name: Compilar APK Grissli Fit

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generar archivos de Android
        run: flutter create . --org com.grisslifit

      - name: Descargar librerias
        run: flutter pub get

      - name: Compilar APK de Android
        run: flutter build apk --release --no-tree-shake-icons

      - name: Guardar APK para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: GrissliFit-APK
          path: build/app/outputs/flutter-apk/app-release.apk
